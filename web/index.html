<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Stok Baju</title>
    <meta name="description" content="Catat stok baju per ukuran dari HP." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Stok Baju" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="stylesheet" href="/app.css" />
    <script type="module" src="/js/main.js"></script>
  </head>
  <body>
    <!-- Ikon SVG dipakai ulang lewat <use href="#i-..."> -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></symbol>
        <symbol id="i-sort" viewBox="0 0 24 24"><path d="M3 6h18M6 12h12M10 18h4" /></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8" /><path d="M21 3v5h-5" /></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></symbol>
        <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4Z" /><path d="m13.5 6.5 4 4" /></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" /></symbol>
        <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" /><circle cx="16" cy="7" r="2" /><circle cx="10" cy="17" r="2" /></symbol>
        <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z" /><circle cx="12" cy="13" r="3.5" /></symbol>
        <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" /></symbol>
      </defs>
    </svg>

    <div class="app">
      <!-- ===== Bar atas ===== -->
      <header class="appbar">
        <div>
          <h1>Stok Baju</h1>
          <p class="sync" id="sync">
            <span class="sync-dot"></span><span id="syncText">Memuat…</span>
          </p>
        </div>
        <div class="appbar-actions">
          <button class="btn ghost sm" id="installBtn" type="button" hidden>
            <svg class="ic"><use href="#i-download" /></svg> Pasang
          </button>
          <button class="icon-btn" id="refreshBtn" type="button" aria-label="Muat ulang">
            <svg class="ic"><use href="#i-refresh" /></svg>
          </button>
        </div>
      </header>

      <!-- ===== Ringkasan ===== -->
      <section class="stats" aria-label="Ringkasan stok">
        <div class="stat">
          <span class="stat-val" id="statPcs">–</span>
          <span class="stat-label"><span id="statModels">0</span> model</span>
        </div>
        <div class="stat">
          <span class="stat-val" id="statValue">–</span>
          <span class="stat-label">nilai stok</span>
        </div>
        <button class="stat" type="button" data-filter="menipis">
          <span class="stat-val warn" id="statLow">–</span>
          <span class="stat-label">menipis</span>
        </button>
        <button class="stat" type="button" data-filter="habis">
          <span class="stat-val bad" id="statOut">–</span>
          <span class="stat-label">habis</span>
        </button>
      </section>

      <!-- ===== Cari, urut, filter (menempel di atas) ===== -->
      <div class="toolbar">
        <div class="search-row">
          <label class="search">
            <svg class="ic"><use href="#i-search" /></svg>
            <input id="search" type="search" placeholder="Cari baju…" autocomplete="off" />
          </label>
          <label class="icon-btn sort" aria-label="Urutkan">
            <svg class="ic"><use href="#i-sort" /></svg>
            <select id="sortSelect">
              <option value="terbaru">Terbaru</option>
              <option value="nama">Nama A–Z</option>
              <option value="stok-asc">Stok paling sedikit</option>
              <option value="stok-desc">Stok paling banyak</option>
              <option value="harga-desc">Harga tertinggi</option>
            </select>
          </label>
        </div>
        <div class="chips" id="filters" role="tablist">
          <button type="button" data-filter="semua">Semua <span></span></button>
          <button type="button" data-filter="tersedia">Tersedia <span></span></button>
          <button type="button" data-filter="menipis">Menipis <span></span></button>
          <button type="button" data-filter="habis">Habis <span></span></button>
        </div>
      </div>

      <!-- ===== Daftar ===== -->
      <main>
        <div class="list-head">
          <span id="resultCount"></span>
          <span id="sortLabel"></span>
        </div>
        <ul class="list" id="list"></ul>
        <div class="empty" id="empty" hidden></div>
      </main>

      <button class="fab" id="addBtn" type="button">
        <svg class="ic"><use href="#i-plus" /></svg> Produk
      </button>
    </div>

    <!-- ===== Sheet: detail produk ===== -->
    <dialog class="sheet" id="detailSheet" aria-label="Detail produk">
      <div class="sheet-inner">
        <div class="grabber"></div>
        <div class="sheet-scroll" id="detailBody"></div>
        <footer class="sheet-foot">
          <button class="btn ghost square" type="button" id="detailDelete" aria-label="Hapus produk">
            <svg class="ic"><use href="#i-trash" /></svg>
          </button>
          <button class="btn ghost" type="button" id="detailEdit">
            <svg class="ic"><use href="#i-edit" /></svg> Edit
          </button>
          <button class="btn primary grow" type="button" id="detailAdjust">
            <svg class="ic"><use href="#i-sliders" /></svg> Atur jumlah
          </button>
        </footer>
      </div>
    </dialog>

    <!-- ===== Sheet: atur stok banyak ===== -->
    <dialog class="sheet" id="adjustSheet" aria-label="Atur jumlah stok">
      <div class="sheet-inner">
        <div class="grabber"></div>
        <div class="sheet-scroll">
          <div class="sheet-head">
            <h2>Atur jumlah</h2>
            <p class="muted" id="adjName"></p>
          </div>
          <div class="seg" id="adjMode">
            <button type="button" data-mode="masuk">Masuk</button>
            <button type="button" data-mode="keluar">Keluar</button>
            <button type="button" data-mode="set">Opname</button>
          </div>
          <div class="chips wrap" id="adjSizes"></div>
          <div class="adj-preview">
            <div><span>Sekarang</span><b id="adjCur">0</b></div>
            <span class="arrow">→</span>
            <div><span>Menjadi</span><b id="adjNext">0</b></div>
          </div>
          <label class="field">
            <span id="adjQtyLabel">Jumlah masuk</span>
            <input class="big-input" id="adjQty" type="number" inputmode="numeric" min="0" />
          </label>
          <div class="qty-presets" id="adjPresets">
            <button type="button" data-qty="1">1</button>
            <button type="button" data-qty="5">5</button>
            <button type="button" data-qty="10">10</button>
            <button type="button" data-qty="25">25</button>
          </div>
        </div>
        <footer class="sheet-foot">
          <button class="btn ghost" type="button" data-close>Batal</button>
          <button class="btn primary grow" type="button" id="adjApply">Simpan</button>
        </footer>
      </div>
    </dialog>

    <!-- ===== Sheet: tambah / edit produk ===== -->
    <dialog class="sheet tall" id="formSheet" aria-label="Form produk">
      <form class="sheet-inner" id="productForm" novalidate>
        <div class="grabber"></div>
        <div class="sheet-scroll">
          <div class="sheet-head">
            <h2 id="formTitle">Produk baru</h2>
          </div>

          <div class="photo-row">
            <button class="photo-pick" type="button" id="photoPick" aria-label="Pilih foto">
              <span id="photoPreview"></span>
            </button>
            <div class="photo-actions">
              <button class="btn ghost sm" type="button" id="photoChoose">
                <svg class="ic"><use href="#i-camera" /></svg> <span id="photoChooseText">Tambah foto</span>
              </button>
              <button class="link-btn bad" type="button" id="photoRemove" hidden>Hapus foto</button>
              <input id="photoInput" type="file" accept="image/*" hidden />
            </div>
          </div>

          <label class="field">
            <span>Nama baju</span>
            <input id="fName" type="text" placeholder="Kaos Oversize Katun Sage" autocomplete="off" />
          </label>

          <label class="field">
            <span>Harga jual</span>
            <div class="prefix-input">
              <i>Rp</i>
              <input id="fPrice" type="text" inputmode="numeric" placeholder="89.000" />
            </div>
          </label>

          <div class="field">
            <span>Ukuran</span>
            <div class="seg" id="sizeModeSeg">
              <button type="button" data-sizemode="on">Pakai ukuran</button>
              <button type="button" data-sizemode="off">All size</button>
            </div>
          </div>

          <div class="size-box" id="sizeBox">
            <div class="chips wrap" id="presetRow"></div>
            <div class="custom-row">
              <input id="customSize" type="text" placeholder="Ukuran lain (28, 30, Jumbo…)" />
              <button class="btn ghost sm" type="button" id="customAdd">Tambah</button>
            </div>
            <ul class="size-list" id="sizeList"></ul>
          </div>

          <div class="size-box" id="singleBox" hidden>
            <div class="size-line">
              <span class="size-name">Jumlah stok</span>
              <div class="stepper">
                <button type="button" data-single="-1" aria-label="Kurangi"><svg class="ic"><use href="#i-minus" /></svg></button>
                <input id="fSingleStock" type="number" inputmode="numeric" min="0" value="0" />
                <button type="button" data-single="1" aria-label="Tambah"><svg class="ic"><use href="#i-plus" /></svg></button>
              </div>
            </div>
          </div>

          <p class="form-error" id="formError" role="alert"></p>
        </div>
        <footer class="sheet-foot">
          <span class="foot-total" id="formTotal">0 pcs</span>
          <button class="btn ghost" type="button" data-close>Batal</button>
          <button class="btn primary" type="submit" id="formSubmit">Simpan</button>
        </footer>
      </form>
    </dialog>

    <!-- ===== Sheet: konfirmasi hapus ===== -->
    <dialog class="sheet" id="deleteSheet" aria-label="Hapus produk">
      <div class="sheet-inner">
        <div class="grabber"></div>
        <div class="sheet-scroll">
          <div class="sheet-head">
            <h2>Hapus produk?</h2>
            <p class="muted" id="deleteText"></p>
          </div>
        </div>
        <footer class="sheet-foot">
          <button class="btn ghost grow" type="button" data-close>Batal</button>
          <button class="btn danger grow" type="button" id="deleteConfirm">Hapus</button>
        </footer>
      </div>
    </dialog>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast" role="status" hidden>
      <span id="toastMsg"></span>
      <button type="button" id="toastAction">Urungkan</button>
    </div>
  </body>
</html>
